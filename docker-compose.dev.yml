version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: mohpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mohpa
      POSTGRES_PASSWORD: mohpa
      POSTGRES_DB: mohpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mohpa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-service:
    build:
      context: .
      dockerfile: packages/api-service/Dockerfile
    container_name: mohpa-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://mohpa:mohpa@postgres:5432/mohpa
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      INTERNAL_API_KEY: mohpa-internal-secret-token
      JWT_SECRET: super-secret-mohpa-jwt-key-change-in-production
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "3000:3000"

  fesl-engine:
    build:
      context: .
      dockerfile: packages/fesl-engine/Dockerfile
    container_name: mohpa-fesl
    restart: unless-stopped
    depends_on:
      - api-service
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      API_SERVICE_URL: http://api-service:3000
      INTERNAL_API_KEY: mohpa-internal-secret-token
      FESL_CLIENT_PORT: 18020
      FESL_SERVER_PORT: 18051
      THEATER_CLIENT_PORT: 18275
      THEATER_SERVER_PORT: 18056
      PUBLIC_IP: 127.0.0.1
    ports:
      - "18020:18020"
      - "18270:18667"
      - "6667:6667"
      - "18667:18667"
      - "18051:18051"
      - "18275:18275"
      - "18056:18056"
      - "29900:29900"
      - "27900:27900/udp"

volumes:
  postgres_data:
  redis_data:
